[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "B008",
    "EXE002",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
"src/main.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"