<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Usuarios y Notas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Vista Inicial de Accesos -->
  <section id="authSection">
    <div class="login-grid">
      <div>
        <h2>Panel Administrador</h2>
        <form id="adminLoginForm">
          <input type="text" id="adminUser" placeholder="Usuario o Email" required />
          <input type="password" id="adminPass" placeholder="Contraseña" required />
          <button type="submit" class="btn-submit">Entrar como Admin</button>
        </form>
      </div>

      <div>
        <h2>Acceso Usuarios</h2>
        <form id="userLoginForm">
          <input type="text" id="normalUser" placeholder="Usuario o Email" required />
          <input type="password" id="normalPass" placeholder="Contraseña" required />
          <button type="submit" class="btn-user-submit">Entrar a mis Notas</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Vista Panel Administrador -->
  <section id="adminSection" class="hidden">
    <div class="panel-header">
      <h2 id="formTitle">Gestión de Usuarios</h2>
      <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
    </div>

    <form id="userForm">
      <input type="hidden" id="userId" />
      <input type="text" id="name" placeholder="Nombre" required />
      <input type="email" id="email" placeholder="Correo electrónico" required />
      <input type="password" id="password" placeholder="Contraseña (en blanco para mantener)" />
      
      <div class="btn-container">
        <button type="submit" id="submitBtn" class="btn-submit">Crear Usuario</button>
        <button type="button" id="cancelBtn" class="btn-cancel" onclick="resetForm()">Cancelar Edición</button>
      </div>
    </form>

    <h2>Usuarios Registrados</h2>
    <ul id="userList"></ul>
  </section>

  <!-- Vista Bloc de Notas de Usuario -->
  <section id="notesSection" class="hidden">
    <div class="panel-header">
      <h2 id="notesGreeting">Mi Bloc de Notas</h2>
      <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
    </div>

    <form id="noteForm">
      <input type="text" id="noteTitle" placeholder="Título de la nota" required />
      <textarea id="noteContent" placeholder="Escribe aquí tu apunte..." required></textarea>
      <button type="submit" class="btn-user-submit">Guardar Nota</button>
    </form>

    <h2>Mis Notas Guardadas</h2>
    <ul id="notesList"></ul>
  </section>

  <script>
    const API_URL = "http://127.0.0.1:8000";
    let cachedUsers = [];

    const token = localStorage.getItem("jwtToken");
    const userRole = localStorage.getItem("isAdmin") === "true";
    const userName = localStorage.getItem("userName");

    if (token) {
      if (userRole) showAdminPanel();
      else showNotesPanel(userName);
    }

    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await handleLogin(document.getElementById("adminUser").value, document.getElementById("adminPass").value, true);
    });

    document.getElementById("userLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await handleLogin(document.getElementById("normalUser").value, document.getElementById("normalPass").value, false);
    });

    async function handleLogin(username, password, requireAdmin) {
      try {
        const formData = new URLSearchParams();
        formData.append("username", username);
        formData.append("password", password);

        const res = await fetch(`${API_URL}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString()
        });

        if (!res.ok) {
          const err = await res.json();
          alert(err.detail || "Credenciales incorrectas");
          return;
        }

        const data = await res.json();
        if (requireAdmin && !data.is_admin) {
          alert("Acceso denegado: no es administrador.");
          return;
        }

        localStorage.setItem("jwtToken", data.access_token);
        localStorage.setItem("isAdmin", data.is_admin);
        localStorage.setItem("userName", data.name);

        if (data.is_admin && requireAdmin) showAdminPanel();
        else showNotesPanel(data.name);
      } catch (err) {
        alert("Error al conectar con la API");
      }
    }

    function getAuthHeaders() {
      return {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${localStorage.getItem("jwtToken")}`
      };
    }

    function showAdminPanel() {
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("notesSection").classList.add("hidden");
      document.getElementById("adminSection").classList.remove("hidden");
      loadUsers();
    }

    function showNotesPanel(name) {
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("adminSection").classList.add("hidden");
      document.getElementById("notesSection").classList.remove("hidden");
      document.getElementById("notesGreeting").textContent = `Bloc de Notas (${name})`;
      loadNotes();
    }

    function logout() {
      localStorage.clear();
      document.getElementById("adminSection").classList.add("hidden");
      document.getElementById("notesSection").classList.add("hidden");
      document.getElementById("authSection").classList.remove("hidden");
      document.getElementById("adminLoginForm").reset();
      document.getElementById("userLoginForm").reset();
    }

    // --- Admin: Usuarios ---
    async function loadUsers() {
      const list = document.getElementById("userList");
      list.innerHTML = "Cargando...";
      try {
        const res = await fetch(`${API_URL}/users/`, { headers: getAuthHeaders() });
        if (res.status === 401 || res.status === 403) { logout(); return; }
        cachedUsers = await res.json();
        list.innerHTML = "";

        if (cachedUsers.length === 0) {
          list.innerHTML = "<li>No hay usuarios registrados.</li>";
          return;
        }

        cachedUsers.forEach(u => {
          const li = document.createElement("li");
          li.innerHTML = `
            <div class="info">
              <strong>${u.name} (ID: ${u.id}) ${u.is_admin ? '[ADMIN]' : ''}</strong>
              <span class="email">${u.email}</span>
            </div>
            <div>
              <button class="btn-edit" onclick="startEdit(${u.id})">Editar</button>
              <button class="btn-delete" onclick="deleteUser(${u.id})">Eliminar</button>
            </div>
          `;
          list.appendChild(li);
        });
      } catch (err) {
        list.innerHTML = "<li>Error al conectar con la API.</li>";
      }
    }

    document.getElementById("userForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("userId").value;
      const isEditing = Boolean(id);
      const passwordInput = document.getElementById("password").value;

      if (!isEditing && !passwordInput) {
        alert("Contraseña obligatoria para nuevos usuarios");
        return;
      }

      const body = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        ...(passwordInput ? { password: passwordInput } : {})
      };

      const url = isEditing ? `${API_URL}/users/${id}` : `${API_URL}/users/`;
      const method = isEditing ? "PUT" : "POST";

      const res = await fetch(url, {
        method: method,
        headers: getAuthHeaders(),
        body: JSON.stringify(body)
      });

      if (res.ok) {
        resetForm();
        loadUsers();
      } else {
        const err = await res.json();
        alert(err.detail || "Error en la solicitud");
      }
    });

    function startEdit(id) {
      const user = cachedUsers.find(u => u.id === id);
      if (!user) return;
      document.getElementById("formTitle").textContent = `Editando #${user.id}`;
      document.getElementById("userId").value = user.id;
      document.getElementById("name").value = user.name;
      document.getElementById("email").value = user.email;
      document.getElementById("password").value = "";
      document.getElementById("submitBtn").textContent = "Guardar Cambios";
      document.getElementById("cancelBtn").style.display = "inline-block";
    }

    function resetForm() {
      document.getElementById("userForm").reset();
      document.getElementById("userId").value = "";
      document.getElementById("formTitle").textContent = "Gestión de Usuarios";
      document.getElementById("submitBtn").textContent = "Crear Usuario";
      document.getElementById("cancelBtn").style.display = "none";
    }

    async function deleteUser(id) {
      if (!confirm(`¿Eliminar usuario ${id}?`)) return;
      const res = await fetch(`${API_URL}/users/${id}`, { method: "DELETE", headers: getAuthHeaders() });
      if (res.ok) loadUsers();
      else alert("Error al eliminar");
    }

    // --- Usuario: Notas ---
    async function loadNotes() {
      const list = document.getElementById("notesList");
      list.innerHTML = "Cargando notas...";
      try {
        const res = await fetch(`${API_URL}/notes/`, { headers: getAuthHeaders() });
        if (res.status === 401) { logout(); return; }
        const notes = await res.json();
        list.innerHTML = "";

        if (notes.length === 0) {
          list.innerHTML = "<li>No tienes notas guardadas aún.</li>";
          return;
        }

        notes.forEach(note => {
          const li = document.createElement("li");
          li.className = "note-item";
          li.innerHTML = `
            <div class="info">
              <strong>${note.title}</strong>
              <span class="content-preview">${note.content}</span>
            </div>
            <button class="btn-delete" onclick="deleteNote(${note.id})">Eliminar</button>
          `;
          list.appendChild(li);
        });
      } catch (err) {
        list.innerHTML = "<li>Error al cargar notas.</li>";
      }
    }

    document.getElementById("noteForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = {
        title: document.getElementById("noteTitle").value,
        content: document.getElementById("noteContent").value
      };

      const res = await fetch(`${API_URL}/notes/`, {
        method: "POST",
        headers: getAuthHeaders(),
        body: JSON.stringify(body)
      });

      if (res.ok) {
        document.getElementById("noteForm").reset();
        loadNotes();
      } else {
        alert("Error al guardar la nota");
      }
    });

    async function deleteNote(noteId) {
      if (!confirm("¿Eliminar esta nota?")) return;
      const res = await fetch(`${API_URL}/notes/${noteId}`, {
        method: "DELETE",
        headers: getAuthHeaders()
      });
      if (res.ok) loadNotes();
      else alert("Error al eliminar la nota");
    }
  </script>
</body>
</html>
